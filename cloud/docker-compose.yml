version: '3.8'

services:
  # Database Service
  mongodb:
    image: mongo:7.0
    container_name: bloodbank_mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: blood_bank
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - bloodbank_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Express Backend API
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: bloodbank_server
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/blood_bank
      JWT_SECRET: production_secure_jwt_secret_cloud_2026
      JWT_EXPIRE: 30d
    ports:
      - '5000:5000'
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - bloodbank_network

  # React Frontend Client (Nginx)
  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: bloodbank_client
    restart: always
    ports:
      - '80:80'
    depends_on:
      - server
    networks:
      - bloodbank_network

volumes:
  mongo_data:
    driver: local

networks:
  bloodbank_network:
    driver: bridge
