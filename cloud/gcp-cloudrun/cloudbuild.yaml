steps:
  # 1. Build Server Container
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/blood-bank-server:$COMMIT_SHA', './server']

  # 2. Push Server Container to Artifact Registry / Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/blood-bank-server:$COMMIT_SHA']

  # 3. Deploy Server to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'blood-bank-server'
      - '--image'
      - 'gcr.io/$PROJECT_ID/blood-bank-server:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/blood-bank-server:$COMMIT_SHA'
